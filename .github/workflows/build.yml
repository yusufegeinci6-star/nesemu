name: Build NES Emulator

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Create platformio.ini
        run: |
          cat > platformio.ini << 'EOF'
          [env:esp32dev]
          platform = espressif32@3.5.0
          board = esp32dev
          framework = arduino
          EOF

      - name: Build firmware
        run: pio run

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nesemu-firmware
          path: .pio/build/esp32dev/firmware.bin2
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nesemu-firmware
          path: build/*.bin
